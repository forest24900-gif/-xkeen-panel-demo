<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>XKeen Server Manager — демо</title><style>
:root{color-scheme:dark;--bg:#0b1220;--p:#142238;--p2:#192b43;--line:#293d57;--t:#edf4ff;--m:#9aabc2;--b:#65aaff;--g:#45d39a;--a:#f2bf62}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 500px at 80% -10%,#1a3b61,transparent 65%),var(--bg);color:var(--t);font:15px/1.5 system-ui, sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#0d1727;border-right:1px solid var(--line);padding:22px 15px}.brand{font-weight:750;font-size:17px;padding:8px 10px 25px}.brand span{display:inline-grid;place-items:center;background:#2869b3;border-radius:10px;width:36px;height:36px;margin-right:9px}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--m);padding:11px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1c304b;color:white}.main{padding:26px clamp(16px,3vw,38px);max-width:1450px;width:100%;margin:auto}.top,.row,.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{margin-bottom:26px;color:var(--m);font-size:13px}.switch{background:#111e31;border:1px solid var(--line);border-radius:11px;padding:4px}.switch button,.btn{border:0;border-radius:8px;padding:8px 12px;background:transparent;color:var(--m);cursor:pointer}.switch button.active,.btn{background:#244d7b;color:white}.head{align-items:end;margin-bottom:20px}.head h1{margin:0;font-size:30px}.sub,.hint{color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:linear-gradient(150deg,var(--p),#101b2c);border:1px solid var(--line);border-radius:15px;padding:17px}.label{font-size:12px;color:var(--m)}.value{font-size:26px;font-weight:750;margin:8px 0 2px}.green{color:var(--g)}.blue{color:var(--b)}.amber{color:var(--a)}.wide{grid-column:span 2}.section{margin-top:15px}.section h3{font-size:16px;margin:0 0 12px}.server,.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.server:last-child,.setting:last-child{border:0}.server small,.setting small{display:block;color:var(--m)}.tag{font-size:11px;color:var(--g);background:#173b32;border-radius:8px;padding:4px 8px}.tip{display:inline-grid;place-items:center;border:1px solid #7595ba;color:#a8cfff;width:17px;height:17px;border-radius:50%;font-size:11px;cursor:help;position:relative;margin-left:4px}.tip:hover:after,.tip:focus:after,.tip.touch:after{content:attr(data-tip);position:absolute;z-index:5;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);width:225px;background:#243a57;border:1px solid #49678c;padding:10px;border-radius:9px;color:white;font-size:12px;font-weight:400;line-height:1.4}.toggle{accent-color:#3187df;width:20px;height:20px}.mobile{display:none}.mutedbox{background:#172840;border-radius:10px;padding:12px;color:var(--m);font-size:13px;margin-top:14px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px;font-size:13px}th{color:var(--m);font-weight:500}
@media(max-width:850px){.app{display:block}.side{display:none}.mobile{display:flex;overflow:auto;gap:5px;margin-bottom:15px}.mobile button{white-space:nowrap;background:#142238;border:1px solid var(--line);color:var(--m);padding:8px;border-radius:8px}.mobile button.active{background:#244d7b;color:white}.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-wrap:wrap}.head{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.main{padding:15px}.grid{gap:8px}.card{padding:12px}.value{font-size:22px}.wide{grid-column:span 2}.head h1{font-size:25px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span>XK</span>XKeen Manager</div><div class="nav" id="nav"></div><p class="mutedbox">ДЕМО-КОНЦЕПЦИЯ<br>Данные условные. К Keenetic не подключено.</p></aside><main class="main"><div class="top"><span>XKeen Server Manager / <b id="crumb">Обзор</b></span><div class="switch"><button id="basic" class="active">Обычный режим</button><button id="pro">Профессиональный</button></div></div><div class="mobile" id="mnav"></div><div id="content"></div></main></div><script>
const names=[["home","▦","Обзор"],["servers","◈","Серверы"],["subs","↻","Подписки"],["pool","◎","Пул и автоматизация"],["routes","⇄","Маршрутизация"],["diag","⌁","Диагностика"],["security","◇","Безопасность"],["settings","⚙","Настройки"]];let page="home",pro=false,tips=true;
function help(s){return tips?'<span class="tip" tabindex="0" data-tip="'+s+'" onclick="this.classList.toggle(\'touch\')">i</span>':''}
function metric(a,b,c,cl,tip){return '<div class="card"><div class="label">'+a+(tip?help(tip):'')+'</div><div class="value '+(cl||'')+'">'+b+'</div><div class="hint">'+c+'</div></div>'}
function header(a,b){return '<div class="head"><div><h1>'+a+'</h1><div class="sub">'+b+'</div></div></div>'}
function render(){let nav=names.map(x=>'<button data-id="'+x[0]+'" class="'+(page===x[0]?'active':'')+'">'+x[1]+'　'+x[2]+'</button>').join('');document.getElementById('nav').innerHTML=nav;document.getElementById('mnav').innerHTML=nav;document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{page=x.dataset.id;render()});document.getElementById('crumb').textContent=names.find(x=>x[0]===page)[2];document.getElementById('basic').className=pro?'':'active';document.getElementById('pro').className=pro?'active':'';let s='';
if(page==='home'){s=header('Обзор','Главное состояние подключения — всё важное на одном экране.')+'<div class="grid">'+metric('Подключение','Работает','Последняя проверка: 12 секунд назад','green','Результат последней проверки соединения.')+metric('Активный сервер','DE · Frankfurt','Основной сервер · приоритет 1','blue','Сервер, через который сейчас проходит подключение.')+metric('Серверы в пуле','12','10 доступны · 1 недоступен · 1 не проверен','','Количество серверов, доступных для выбора.')+metric('Задержка','42 мс','Хорошая · измерено недавно','green','Время отклика сервера. Меньше обычно лучше, но также учитывается приоритет.')+'<div class="panel wide section"><h3>Состояние серверов</h3><div class="server"><b>● DE · Frankfurt <small>Основной · 42 мс</small></b><span class="tag">Активен</span></div><div class="server"><b>● NL · Amsterdam <small>Резервный · 51 мс</small></b><span class="tag">Доступен</span></div><div class="server"><b>● FI · Helsinki <small>Последняя проверка не пройдена</small></b><span class="tag" style="color:var(--a)">Проблема</span></div></div><div class="panel wide section"><h3>Последние события</h3><div class="server">Проверка подключения пройдена <small>12 секунд назад</small></div><div class="server">Подписка обновлена без ошибок <small>Сегодня, 09:30</small></div><div class="server">Один сервер требует повторной проверки <small>Сегодня, 09:12</small></div></div></div>'}
if(page==='servers'){s=header('Серверы','Сохранённые серверы, приоритеты и понятные статусы.')+'<div class="panel"><table><tr><th>Сервер</th><th>Состояние</th><th>Задержка</th><th>Приоритет</th>'+(pro?'<th>Протокол</th>':'')+'</tr>'+[['DE · Frankfurt','Активен','42 мс','1','VLESS'],['NL · Amsterdam','Доступен','51 мс','2','VLESS'],['PL · Warsaw','Не проверен','—','3','WireGuard'],['FI · Helsinki','Недоступен','—','4','VLESS']].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td>'+(pro?'<td>'+x[4]+'</td>':'')+'</tr>').join('')+'</table><div class="mutedbox">В демо управление отключено. В рабочей панели операции будут подключены к реальным функциям.</div></div>'}
if(page==='subs'){s=header('Подписки','Источники серверов, обновления и контроль изменений.')+'<div class="grid">'+metric('Источники','2','Обе подписки добавлены')+metric('Последнее обновление','09:30','Сегодня')+metric('Новые серверы','3','Ожидают просмотра','blue')+metric('Ошибки','0','Обновление прошло успешно','green')+'</div><div class="panel section"><h3>Источники подписок</h3><div class="server">Основная подписка <span class="tag">Активна</span></div><div class="server">Резервная подписка <span class="tag">Активна</span></div><p class="hint">Секретные ссылки в демо не используются.</p></div>'}
if(page==='pool'){s=header('Пул и автоматизация','Панель следит за серверами и помогает выбрать рабочий.')+'<div class="grid">'+metric('Серверов в пуле','12','10 доступны')+metric('Проверка','Каждые 60 сек','Демонстрационный интервал')+metric('Автопереключение','Включено','При подтверждённом отказе','green','Сначала несколько проверок, затем выбор резервного сервера.')+metric('Последнее решение','Без изменений','Активный сервер исправен')+'</div><div class="panel section"><div class="setting"><div>Автоматическое переключение'+help('При подтверждённом отказе активного сервера панель выберет резервный.')+'<small>Демо-переключатель не меняет подключение</small></div><input type="checkbox" class="toggle" checked></div></div>'}
if(page==='routes'){s=header('Маршрутизация','Правила, которыми управляет XKeen/Xray.')+'<div class="panel"><div class="server">YouTube <small>Через VPN</small><span class="tag">Включено</span></div><div class="server">Google Search <small>Напрямую через провайдера</small><span class="tag">Включено</span></div><div class="server">Остальной трафик <small>По основной политике</small><span class="tag">По умолчанию</span></div><p class="hint">Перед применением изменений рабочая панель покажет разницу и запросит подтверждение.</p></div>'}
if(page==='diag'){s=header('Диагностика','Понятное состояние системы и история событий.')+'<div class="grid">'+metric('Xray','Работает','Демо-статус','green')+metric('Проверка сети','Успешно','12 секунд назад','green')+metric('DNS','Без ошибок','Только чтение','green')+metric('Предупреждения','1','Сервер требует проверки','amber')+'</div><div class="panel section"><h3>Журнал событий</h3><div class="server">Проверка подключения пройдена <small>09:42:18</small></div><div class="server">Сервер FI · Helsinki не ответил <small>09:41:03</small></div></div>'}
if(page==='security'){s=header('Безопасность','Защита доступа и действия пользователей.')+'<div class="panel"><div class="setting">Учётная запись владельца <span class="tag">Предусмотрена</span></div><div class="setting">Защита входа <span class="tag">Предусмотрена</span></div><div class="setting">Доступ из локальной сети <span class="tag">По разрешению владельца</span></div></div>'}
if(page==='settings'){s=header('Настройки','Настрой удобство и внешний вид панели.')+'<div class="panel"><div class="setting"><div>Показывать поясняющие подсказки'+help('Подсказки объясняют назначение разделов, показателей и настроек. На компьютере — при наведении, на телефоне — нажатием.')+'<small>На компьютере при наведении, на телефоне по нажатию</small></div><input id="tipcheck" type="checkbox" class="toggle" '+(tips?'checked':'')+'></div><div class="setting">Режим интерфейса <span class="tag">'+(pro?'Профессиональный':'Обычный')+'</span></div><div class="setting">Язык <span class="tag">Русский</span></div></div>'}
if(pro){s='<div class="mutedbox" style="margin-bottom:14px;color:#f3d08b">Профессиональный режим: дополнительные технические сведения. Все данные демонстрационные.</div>'+s}
document.getElementById('content').innerHTML=s;if(page==='settings')document.getElementById('tipcheck').onchange=e=>{tips=e.target.checked;render()}}
document.getElementById('basic').onclick=()=>{pro=false;render()};document.getElementById('pro').onclick=()=>{pro=true;render()};render();
</script></body></html>
