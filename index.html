<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>XKeen — Центр управления сетью</title>
<style>
:root{color-scheme:dark;--bg:#080f1d;--surface:#101b2d;--surface2:#142238;--stroke:#243650;--text:#edf4ff;--muted:#91a2bb;--blue:#6eaaff;--cyan:#58d5df;--green:#55d6a0;--yellow:#f4c66f;--red:#ff7f87;--shadow:0 18px 50px #02071166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 550px at 80% -20%,#18375a66,transparent 70%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}
button,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.sidebar{background:#0b1423eF;border-right:1px solid var(--stroke);padding:25px 16px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:12px;padding:0 9px}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#398eea,#56d4db);display:grid;place-items:center;color:#061424;font-weight:900;font-size:16px;box-shadow:0 8px 24px #348ce955}.brand strong{display:block;font-size:15px;letter-spacing:.02em}.brand small{color:var(--muted);font-size:11px}.navlabel{color:#667a96;text-transform:uppercase;font-size:10px;letter-spacing:.14em;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#9aabc2;border-radius:11px;text-align:left;padding:11px 12px;display:flex;align-items:center;gap:12px;transition:.2s}.nav button .ico{width:20px;text-align:center;font-size:17px}.nav button:hover{background:#17283f;color:white}.nav button.active{background:linear-gradient(100deg,#1b3d62,#19304c);border-color:#31577e;color:white;box-shadow:inset 3px 0 #6eaaff}.sidefoot{margin-top:auto;background:#111f32;border:1px solid var(--stroke);border-radius:14px;padding:14px}.live{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.sidefoot p{color:var(--muted);font-size:11px;margin:8px 0 0}
main{min-width:0;padding:28px clamp(18px,3vw,42px) 45px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:30px}.crumb{color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:12px}.mode{display:flex;padding:4px;border:1px solid var(--stroke);background:#0d1727;border-radius:12px}.mode button{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;font-size:12px}.mode button.active{background:#24466d;color:white}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#426b9d,#263b58);display:grid;place-items:center;font-weight:700}
h1{font-size:clamp(25px,3vw,34px);line-height:1.15;letter-spacing:-.035em;margin:0 0 8px}.subtitle{color:var(--muted);font-size:13px}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:24px}.eyebrow{font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:.16em;margin-bottom:9px}
.btn{border:1px solid #355578;background:#1b3b5e;color:#e8f3ff;border-radius:10px;padding:9px 13px;font-size:12px;box-shadow:0 5px 15px #06132655}.btn:hover{background:#254e78}.btn.ghost{background:#111e30;border-color:var(--stroke);color:#b9c9dd;box-shadow:none}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:14px}.metric,.panel{background:linear-gradient(145deg,#14243a,#101b2c 75%);border:1px solid var(--stroke);border-radius:17px;box-shadow:var(--shadow)}.metric{padding:17px 18px;min-height:125px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-42px;background:#5ca6ff0b}.metriclabel{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.metricvalue{font-size:27px;font-weight:700;letter-spacing:-.04em;margin:9px 0 2px}.metricfoot{font-size:11px;color:var(--muted)}.positive{color:var(--green)}.warning{color:var(--yellow)}.accent{color:var(--blue)}
.contentgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px}.panel{padding:19px;margin-bottom:14px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.paneltitle{font-size:14px;font-weight:650}.panelhint{color:var(--muted);font-size:11px}.legend{display:flex;gap:14px;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:6px}.swatch{width:7px;height:7px;border-radius:50%;background:var(--blue)}.swatch.cyan{background:var(--cyan)}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{fill:#71849e;font-size:10px}.chart .gridline{stroke:#293c55;stroke-width:1;stroke-dasharray:3 5}.chart .area{fill:url(#area)}.chart .line{fill:none;stroke:var(--blue);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.chart .line2{fill:none;stroke:var(--cyan);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.list{display:grid}.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #26384e}.listrow:last-child{border-bottom:0}.itemname{font-size:12px;font-weight:600}.itemmeta{font-size:10px;color:var(--muted);margin-top:3px}.status{font-size:10px;padding:5px 8px;border-radius:20px;color:var(--green);background:#183b35;white-space:nowrap}.status.warn{color:var(--yellow);background:#44371e}.status.blue{color:#9bc6ff;background:#1d3857}
.deviceicon{width:34px;height:34px;border-radius:11px;background:#1d3450;display:grid;place-items:center;font-size:16px;flex:none}.devleft{display:flex;align-items:center;gap:10px;min-width:0}.deviceinfo{min-width:0}.deviceinfo .itemname,.deviceinfo .itemmeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:#8497b1;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:11px 9px;border-bottom:1px solid var(--stroke)}td{padding:13px 9px;border-bottom:1px solid #26384e;font-size:12px}tr:last-child td{border-bottom:0}.select{background:#0c1727;border:1px solid #344c68;color:#e4efff;border-radius:9px;padding:8px 10px;min-width:120px;font-size:11px;max-width:100%}.select:focus{outline:2px solid #5799e8}
.callout{background:#142a42;border:1px solid #2c4b6c;border-radius:12px;padding:12px 14px;color:#a9bfd9;font-size:11px;margin-top:14px}.callout b{color:#e4efff}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--stroke)}.switchrow:last-child{border:0}.switchrow strong{font-size:12px}.switchrow small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.toggle{accent-color:#62aaff;width:18px;height:18px}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid #59718f;border-radius:50%;font-size:10px;color:#b9d6f7;cursor:help;position:relative}.info:focus:after,.info:hover:after,.info.open:after{content:attr(data-tip);position:absolute;z-index:9;top:22px;left:0;width:220px;background:#263b56;border:1px solid #476485;border-radius:9px;padding:10px;color:white;font-size:11px;font-weight:400;box-shadow:var(--shadow)}
.empty{color:var(--muted);font-size:12px;padding:15px 0}.hidden{display:none!important}
@media(max-width:1050px){.layout{grid-template-columns:215px minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.contentgrid{grid-template-columns:1fr}}
@media(max-width:700px){.layout{display:block}.sidebar{display:none}main{padding:16px 14px 35px}.topbar{margin-bottom:24px}.topright{gap:7px}.mode button{padding:7px 8px;font-size:10px}.avatar{display:none}.pagehead{align-items:flex-start;flex-direction:column}.metrics{gap:9px}.metric{padding:14px;min-height:112px;border-radius:14px}.metricvalue{font-size:24px}.panel{padding:15px;border-radius:15px}.mobile-nav{display:flex!important;gap:5px;overflow-x:auto;padding:0 0 12px;margin-bottom:19px;scrollbar-width:none}.mobile-nav button{white-space:nowrap;background:#111f32;border:1px solid var(--stroke);color:#9aabc2;padding:8px 10px;border-radius:9px;font-size:11px}.mobile-nav button.active{background:#24466d;color:white;border-color:#416b98}.legend{gap:9px}.panelhead{align-items:flex-start;flex-wrap:wrap}}
.mobile-nav{display:none}
</style></head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="brand"><div class="brandmark">XK</div><div><strong>XKEEN MANAGER</strong><small>NETWORK CONTROL CENTER</small></div></div>
<div><div class="navlabel">Управление</div><nav class="nav" id="sideNav"></nav></div>
<div class="sidefoot"><div class="live"><i class="dot"></i> ДЕМО-РЕЖИМ</div><p>Макет интерфейса. Данные условные, подключение к роутеру не выполняется.</p></div>
</aside>
<main>
<div class="topbar"><div class="crumb">ПАНЕЛЬ УПРАВЛЕНИЯ　/　<span id="crumb">Обзор</span></div><div class="topright"><div class="mode"><button id="basic" class="active">Обычный</button><button id="pro">Профи</button></div><div class="avatar">A</div></div></div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div id="content"></div>
</main>
</div>
<script>
const pages=[['home','⌂','Обзор'],['routes','⇄','Маршрутизация'],['servers','◈','Серверы'],['subs','↻','Подписки'],['pool','◎','Автоматизация'],['diag','⌁','Диагностика'],['security','◇','Безопасность'],['settings','⚙','Настройки']];
let page='home',pro=false,tips=true;
const devices=[{name:'Телевизор',ip:'192.168.50.20',kind:'▣',state:'Онлайн',route:'vpn',profile:'Основной · DE'},{name:'Рабочий ПК',ip:'192.168.50.30',kind:'▤',state:'Онлайн',route:'direct',profile:'—'},{name:'Телефон',ip:'192.168.50.40',kind:'▯',state:'Онлайн',route:'vpn',profile:'Профиль 2 · NL'},{name:'Планшет',ip:'192.168.50.50',kind:'▯',state:'Онлайн',route:'vpn',profile:'Основной · DE'},{name:'Игровая приставка',ip:'192.168.50.60',kind:'▣',state:'Не в сети',route:'direct',profile:'—'},{name:'Ноутбук',ip:'192.168.50.70',kind:'▤',state:'Онлайн',route:'vpn',profile:'Профиль 2 · NL'}];
function tip(t){return tips?'<button class="info" type="button" aria-label="Пояснение" data-tip="'+t+'" onclick="this.classList.toggle(\'open\')">i</button>':''}
function metric(label,value,foot,cls,explain){return '<div class="metric"><div class="metriclabel">'+label+(explain?tip(explain):'')+'</div><div class="metricvalue '+(cls||'')+'">'+value+'</div><div class="metricfoot">'+foot+'</div></div>'}
function head(kicker,title,subtitle,action){return '<div class="pagehead"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><div class="subtitle">'+subtitle+'</div></div>'+(action||'')+'</div>'}
function chart(){return '<svg class="chart" viewBox="0 0 680 220" role="img" aria-label="Демонстрационный график сетевого трафика"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6eaaff" stop-opacity=".24"/><stop offset="1" stop-color="#6eaaff" stop-opacity="0"/></linearGradient></defs><path class="gridline" d="M45 25H665M45 70H665M45 115H665M45 160H665"/><text x="4" y="28">120</text><text x="10" y="73">80</text><text x="10" y="118">40</text><text x="20" y="163">0</text><path class="area" d="M45 130 C75 115 85 120 110 98 S155 115 180 85 S225 92 250 67 S295 90 320 75 S365 45 390 70 S435 98 460 65 S505 72 530 53 S575 67 600 42 S640 55 665 34 L665 160 L45 160Z"/><path class="line" d="M45 130 C75 115 85 120 110 98 S155 115 180 85 S225 92 250 67 S295 90 320 75 S365 45 390 70 S435 98 460 65 S505 72 530 53 S575 67 600 42 S640 55 665 34"/><path class="line2" d="M45 148 C75 142 85 145 110 135 S155 143 180 128 S225 139 250 124 S295 132 320 119 S365 125 390 117 S435 136 460 120 S505 128 530 111 S575 123 600 105 S640 116 665 100"/><text x="45" y="190">23:00</text><text x="195" y="190">23:15</text><text x="350" y="190">23:30</text><text x="505" y="190">23:45</text><text x="630" y="190">Сейчас</text></svg>'}
function renderNav(){const markup=pages.map(p=>'<button data-page="'+p[0]+'" class="'+(page===p[0]?'active':'')+'"><span class="ico">'+p[1]+'</span>'+p[2]+'</button>').join('');document.getElementById('sideNav').innerHTML=markup;document.getElementById('mobileNav').innerHTML=markup;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('crumb').textContent=pages.find(p=>p[0]===page)[2]}
function dashboard(){return head('СОСТОЯНИЕ СЕТИ','Всё под контролем','Сводка домашней сети и VPN-подключения.', '<button class="btn ghost" onclick="alert(\'Демо: показаны условные данные.\')">⟳　Обновить</button>')+'<section class="metrics">'+metric('Интернет','Подключён','Ростелеком · основной канал','positive','Состояние интернет-подключения.')+metric('VPN-ТУННЕЛЬ','Активен','Основной профиль · DE','positive','Фактическое состояние VPN-соединения.')+metric('УСТРОЙСТВА','8','6 онлайн · 2 неактивны','accent','Устройства, обнаруженные в локальной сети.')+metric('ЗАДЕРЖКА','42 мс','До активного VPN-сервера','positive','Время отклика до сервера.')+'</section><div class="contentgrid"><div><section class="panel"><div class="panelhead"><div><div class="paneltitle">Сетевой трафик</div><div class="panelhint">Скорость передачи данных · последние 60 минут</div></div><div class="legend"><span><i class="swatch"></i> Входящий</span><span><i class="swatch cyan"></i> Исходящий</span></div></div>'+chart()+'<div class="row" style="display:flex;justify-content:space-between"><span class="panelhint">↓　86,4 Мбит/с</span><span class="panelhint">↑　18,2 Мбит/с</span></div></section><section class="panel"><div class="panelhead"><div class="paneltitle">Устройства сети</div><button class="btn ghost" onclick="page=\'routes\';render()">Все устройства　→</button></div><div class="list">'+devices.slice(0,4).map(d=>'<div class="listrow"><div class="devleft"><div class="deviceicon">'+d.kind+'</div><div class="deviceinfo"><div class="itemname">'+d.name+'</div><div class="itemmeta">'+d.ip+'</div></div></div><span class="status '+(d.route==='vpn'?'blue':'')+'">'+(d.route==='vpn'?'Через VPN':'Напрямую')+'</span></div>').join('')+'</div></section></div><div><section class="panel"><div class="panelhead"><div class="paneltitle">Состояние ресурсов</div><span class="panelhint">Устройство</span></div><div class="switchrow"><div style="width:100%"><strong>Процессор</strong><strong style="float:right">24%</strong><div style="height:6px;background:#263a54;border-radius:8px;margin-top:9px"><div style="width:24%;height:6px;background:#6eaaff;border-radius:8px"></div></div></div></div><div class="switchrow"><div style="width:100%"><strong>Память</strong><strong style="float:right">61%</strong><div style="height:6px;background:#263a54;border-radius:8px;margin-top:9px"><div style="width:61%;height:6px;background:#58d5df;border-radius:8px"></div></div></div></div><div class="panelhint">Условные показатели для демонстрации</div></section><section class="panel"><div class="panelhead"><div class="paneltitle">VPN-серверы</div><span class="status">Стабильно</span></div><div class="list"><div class="listrow"><div><div class="itemname">DE · Frankfurt</div><div class="itemmeta">Основной сервер</div></div><span class="status">42 мс</span></div><div class="listrow"><div><div class="itemname">NL · Amsterdam</div><div class="itemmeta">Резервный сервер</div></div><span class="status blue">51 мс</span></div><div class="listrow"><div><div class="itemname">FI · Helsinki</div><div class="itemmeta">Требует проверки</div></div><span class="status warn">Проблема</span></div></div></section><section class="panel"><div class="paneltitle">Последние события</div><div class="list"><div class="listrow"><div><div class="itemname">VPN-проверка пройдена</div><div class="itemmeta">12 секунд назад</div></div><span class="status">OK</span></div><div class="listrow"><div><div class="itemname">Обновлена статистика</div><div class="itemmeta">1 минуту назад</div></div></div></div></section></div></div>'}
function routes(){return head('УПРАВЛЕНИЕ ТРАФИКОМ','Маршруты устройств','Назначай каждому устройству свой путь в интернет.')+'<section class="metrics">'+metric('В СЕТИ','8','Обнаружено устройств','accent')+metric('ЧЕРЕЗ VPN','5','Назначен VPN-профиль','positive')+metric('НАПРЯМУЮ','3','Через провайдера','')+metric('ОШИБКИ','0','Проблем маршрутизации','positive')+'</section><section class="panel"><div class="panelhead"><div><div class="paneltitle">Домашняя сеть</div><div class="panelhint">Выбери устройство и назначь маршрут</div></div><button class="btn ghost" onclick="alert(\'В рабочей панели список будет получен из DHCP и таблицы соседей роутера.\')">⟳　Обновить</button></div><div class="tablewrap"><table><thead><tr><th>Устройство</th><th>IP-адрес</th><th>Состояние</th><th>Маршрут</th><th>VPN-профиль</th></tr></thead><tbody>'+devices.map((d,i)=>'<tr><td><div class="devleft"><div class="deviceicon">'+d.kind+'</div><div class="deviceinfo"><div class="itemname">'+d.name+'</div></div></div></td><td>'+d.ip+'</td><td><span class="status '+(d.state==='Онлайн'?'':'warn')+'">'+d.state+'</span></td><td><select class="select" onchange="changeRoute('+i+',this.value)"><option value="direct" '+(d.route==='direct'?'selected':'')+'>Напрямую</option><option value="vpn" '+(d.route==='vpn'?'selected':'')+'>Через VPN</option></select></td><td><select class="select" id="profile'+i+'" '+(d.route==='direct'?'disabled':'')+' onchange="devices['+i+'].profile=this.value"><option '+(d.profile==='Основной · DE'?'selected':'')+'>Основной · DE</option><option '+(d.profile==='Профиль 2 · NL'?'selected':'')+'>Профиль 2 · NL</option><option '+(d.profile==='Резервный · FI'?'selected':'')+'>Резервный · FI</option></select></td></tr>').join('')+'</tbody></table></div><div class="callout"><b>Важно.</b> Это демонстрация интерфейса. Выборы не меняют реальные маршруты Keenetic и не отправляют команды на роутер.</div></section><div class="contentgrid"><section class="panel"><div class="paneltitle">Как это будет работать</div><div class="list"><div class="listrow"><div><div class="itemname">01 · Обнаружение</div><div class="itemmeta">Список устройств из домашней сети</div></div><span class="status blue">DHCP / ARP</span></div><div class="listrow"><div><div class="itemname">02 · Назначение</div><div class="itemmeta">Прямой маршрут или VPN-профиль</div></div><span class="status blue">Правило</span></div><div class="listrow"><div><div class="itemname">03 · Проверка</div><div class="itemmeta">Сверка назначенного и фактического пути</div></div><span class="status">Контроль</span></div></div></section><section class="panel"><div class="paneltitle">Изменения маршрутов</div><p class="panelhint">В реальной панели перед применением будет показан список изменений и запрошено подтверждение владельца.</p><button class="btn" onclick="alert(\'Демо: изменения не применяются. В рабочей панели потребуется отдельное подтверждение.\')">Проверить изменения</button></section></div>'}
function generic(){const data={servers:['СЕРВЕРЫ','Список серверов','Состояние, задержка и приоритеты.',['DE · Frankfurt','NL · Amsterdam','PL · Warsaw','FI · Helsinki']],subs:['ИСТОЧНИКИ','Подписки','Источники конфигураций и обновления.',['Основная подписка','Резервная подписка']],pool:['АВТОМАТИЗАЦИЯ','Пул серверов','Контроль доступности и правила переключения.',['Проверка серверов','Резервный сервер','Автоматическое переключение']],diag:['СИСТЕМА','Диагностика','Состояние компонентов и последние проверки.',['Xray · Работает','DNS · Без ошибок','Проверка соединения · Успешно']],security:['ЗАЩИТА','Безопасность','Контроль доступа и защита панели.',['Учётная запись владельца','Защита входа','Доступ из локальной сети']]};const d=data[page];return head(d[0],d[1],d[2])+'<section class="panel"><div class="list">'+d[3].map(x=>'<div class="listrow"><div class="itemname">'+x+'</div><span class="status">Предусмотрено</span></div>').join('')+'</div><div class="callout">Демонстрационный экран. Реальные данные и действия появятся после подключения к backend.</div></section>'}
function settings(){return head('ПЕРСОНАЛИЗАЦИЯ','Настройки интерфейса','Панель должна быть удобной и понятной каждый день.')+'<section class="panel"><div class="switchrow"><div><strong>Поясняющие подсказки '+tip('Кратко объясняют назначение разделов и элементов.')+'</strong><small>На компьютере — при наведении, на телефоне — по нажатию</small></div><input class="toggle" id="tips" type="checkbox" '+(tips?'checked':'')+'></div><div class="switchrow"><div><strong>Режим интерфейса</strong><small>Обычный или профессиональный</small></div><span class="status blue">'+(pro?'Профессиональный':'Обычный')+'</span></div><div class="switchrow"><div><strong>Язык интерфейса</strong><small>Язык названий и пояснений</small></div><span class="status">Русский</span></div></section>'}
function changeRoute(i,v){devices[i].route=v;document.getElementById('profile'+i).disabled=v==='direct';if(v==='direct')devices[i].profile='—';else if(devices[i].profile==='—')devices[i].profile='Основной · DE'}
function render(){renderNav();document.getElementById('basic').classList.toggle('active',!pro);document.getElementById('pro').classList.toggle('active',pro);let out=page==='home'?dashboard():page==='routes'?routes():page==='settings'?settings():generic();if(pro)out='<div class="callout" style="margin-bottom:15px">Профессиональный режим · дополнительные технические сведения и параметры</div>'+out;document.getElementById('content').innerHTML=out;if(page==='settings')document.getElementById('tips').onchange=e=>{tips=e.target.checked;render()}}
document.getElementById('basic').onclick=()=>{pro=false;render()};document.getElementById('pro').onclick=()=>{pro=true;render()};render();
</script>
